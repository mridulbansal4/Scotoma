[project]
name = "payloop"
version = "1.0.0"
description = "PayLoop — closed-loop adversarial fraud engine"
requires-python = ">=3.11,<3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
# The exception names are fixed by the specification and are read back in the API error table.
"runtime/errors.py" = ["N818"]
"api/routes_*.py" = ["N818"]
"api/jobs.py" = ["N818"]
"tests/*" = ["E501"]

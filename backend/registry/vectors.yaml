- id: V01
  name: PAN/CVV enumeration
  rails: [CARD_CNP]
  tier: 1
  mechanism: distributed low-velocity probing of candidate card numbers across many merchants
  genai_delta: LLM-tuned scripts spread probes under per-merchant rate limits
  observable_signals:
    - burst of low-value auths per device or ip
    - decline_rate inversion versus population baseline
    - many distinct pan_token on one device_id
    - low entropy in PAN sequence within one bin
    - MCC clustering on weak-control merchants
  status: documented
  sources: ["Visa PERC H2 2024", "Visa Payment Fraud Disruption 2025"]
  sim_difficulty: low
  injector: backend.generate.injectors.enumeration:EnumerationCampaign
  expected_features: [distinct_pan_per_device_10m, declrate_ip_1h, bin_seq_entropy]
  countermeasure: velocity throttling + BIN anomaly + merchant control uplift
  blind_holdout: false


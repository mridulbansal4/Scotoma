services:
  redis:
    image: redis:7.4-alpine
    command: redis-server --maxmemory-policy noeviction --appendonly no
    ports: ["6379:6379"]

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      REDIS_URL: redis://redis:6379/0
      RUN_ID: ${RUN_ID:-2026-08-31-final}
    ports: ["${API_PORT:-8000}:8000"]
    depends_on: [redis]

  web:
    image: node:20.11.1-slim
    working_dir: /web
    volumes:
      - ./web:/web
    command: sh -c "npm install && npm run build && npm start -- --port 3000"
    ports: ["${WEB_PORT:-3000}:3000"]
